name: Supabase migrations

# supabase/migrations 의 새 SQL을 main에 올리면 DB에 자동으로 적용한다.
# 지금까지는 SQL을 대화창에서 복사해 SQL 편집기에 붙여 넣었고, 빠뜨리거나
# 순서가 바뀌면 화면만 새 버전이 되어 오류가 났다.
#
# 필요한 저장소 시크릿 (Settings > Secrets and variables > Actions):
#   SUPABASE_ACCESS_TOKEN  - 엣지 함수 배포와 같은 값
#   SUPABASE_PROJECT_REF   - 엣지 함수 배포와 같은 값
#   SUPABASE_DB_PASSWORD   - 대시보드 > Project Settings > Database 의 DB 비밀번호
# 선택 (스테이징 프로젝트를 만들었을 때만):
#   STAGING_PROJECT_REF / STAGING_DB_PASSWORD - 있으면 스테이징에 먼저 적용하고,
#                                                실패하면 운영 DB는 건드리지 않는다.
#
# 처음 한 번은 Actions 탭에서 이 워크플로를 수동 실행(mode=repair, up_to=이미
# 손으로 적용한 마지막 번호)해서 "여기까지는 이미 적용됨"을 기록해야 한다.
# 기록이 없으면 0001부터 다시 돌리려 하므로, 그 경우 아래 안전장치가 멈춘다.

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - ".github/workflows/supabase-migrations.yml"
  workflow_dispatch:
    inputs:
      mode:
        description: "push = 적용 / dry-run = 적용할 목록만 확인 / repair = 이미 적용한 번호를 기록"
        type: choice
        options: [dry-run, push, repair]
        default: dry-run
      up_to:
        description: "repair 전용: 이미 손으로 적용한 마지막 번호 (예: 0060)"
        required: false

concurrency:
  group: supabase-migrations
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Run
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          STAGING_REF: ${{ secrets.STAGING_PROJECT_REF }}
          STAGING_PASSWORD: ${{ secrets.STAGING_DB_PASSWORD }}
          MODE: ${{ github.event_name == 'push' && 'push' || inputs.mode }}
          UP_TO: ${{ inputs.up_to }}
        run: |
          set -euo pipefail

          # 비밀번호를 아직 등록하지 않았다면 지금처럼 손으로 적용하는 방식을 유지한다.
          if [ -z "${SUPABASE_ACCESS_TOKEN}" ] || [ -z "${PROJECT_REF}" ] || [ -z "${DB_PASSWORD}" ]; then
            echo "::notice::SUPABASE_DB_PASSWORD 시크릿이 없어 자동 적용을 건너뜁니다. SQL은 지금처럼 SQL 편집기에서 실행해 주세요."
            exit 0
          fi

          run_on() {
            local ref="$1" password="$2" label="$3"
            echo "════ ${label} (${MODE})"
            supabase link --project-ref "$ref" --password "$password" >/dev/null

            if [ "$MODE" = "repair" ]; then
              if ! [[ "${UP_TO}" =~ ^[0-9]{4}$ ]]; then
                echo "::error::up_to 에 네 자리 번호(예: 0060)를 넣어 주세요."
                exit 1
              fi
              versions=$(ls supabase/migrations | grep -oE '^[0-9]{4}' | awk -v max="$UP_TO" '$1 <= max')
              supabase migration repair --status applied $versions --password "$password"
              supabase migration list --password "$password"
              return
            fi

            plan=$(supabase db push --dry-run --password "$password" 2>&1)
            echo "$plan"

            # 기록이 비어 있으면 0001(기본 스키마)부터 다시 돌리려 한다. 절대 진행하지 않는다.
            # (스테이징은 빈 프로젝트에서 처음부터 쌓는 게 맞으므로 운영 DB에만 적용)
            if [ "$label" = "production" ] && echo "$plan" | grep -q "0001_baseline"; then
              echo "::error::${label}: 적용 기록이 없습니다. 먼저 mode=repair 로 이미 적용한 번호를 기록해 주세요."
              exit 1
            fi

            if [ "$MODE" = "push" ]; then
              supabase db push --password "$password"
            fi
          }

          # repair는 "운영 DB에 손으로 적용한 기록"이라 스테이징에는 하지 않는다.
          if [ "$MODE" != "repair" ] && [ -n "${STAGING_REF}" ] && [ -n "${STAGING_PASSWORD}" ]; then
            run_on "$STAGING_REF" "$STAGING_PASSWORD" "staging"
          fi
          run_on "$PROJECT_REF" "$DB_PASSWORD" "production"
