name: Supabase migrations

# 마이그레이션은 자동으로 돌리지 않는다. 수동 실행(Actions 탭 > Run workflow)만 받는다.
#
# ⚠️ 처음 쓰기 전에 반드시 읽을 것
# 지금까지 SQL은 Supabase 대시보드의 SQL 편집기에 붙여넣어 실행해 왔다. 그렇게 하면
# Supabase의 마이그레이션 이력 테이블(supabase_migrations.schema_migrations)에는
# 아무 기록도 남지 않는다. 그 상태에서 `db push`를 돌리면 CLI가 0001부터 전부
# "아직 적용되지 않았다"고 보고 처음부터 다시 실행한다 — 0001_baseline까지 포함해서.
#
# 그래서 첫 사용 전에 이미 적용한 마이그레이션을 이력에 등록해야 한다:
#   1) action: status 로 먼저 실행해 CLI가 무엇을 적용됨으로 보는지 확인한다.
#   2) 로컬에서 이미 적용한 버전들을 이력에 표시한다.
#        supabase link --project-ref <ref>
#        supabase migration repair --status applied 0001 0002 ... 0043
#   3) 다시 status 를 돌려 모두 applied 로 보이는지 확인한다.
#   4) 그 뒤부터 새 마이그레이션만 push 로 적용한다.
#
# 필요한 저장소 시크릿:
#   SUPABASE_ACCESS_TOKEN  - 계정 액세스 토큰
#   SUPABASE_PROJECT_REF   - 프로젝트 참조 ID
#   SUPABASE_DB_PASSWORD   - 데이터베이스 비밀번호 (Settings > Database)

on:
  workflow_dispatch:
    inputs:
      action:
        description: "status = 적용 현황만 확인(안전) / push = 미적용 마이그레이션 실제 적용"
        required: true
        default: status
        type: choice
        options: [status, push]
      confirm:
        description: "push 를 고른 경우에만: 위 주의사항을 읽었으면 apply 를 입력"
        required: false
        default: ""

concurrency:
  group: supabase-migrations
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Guard
        env:
          ACTION: ${{ inputs.action }}
          CONFIRM: ${{ inputs.confirm }}
          ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          if [ -z "$ACCESS_TOKEN" ] || [ -z "$PROJECT_REF" ] || [ -z "$DB_PASSWORD" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN / SUPABASE_PROJECT_REF / SUPABASE_DB_PASSWORD 시크릿이 필요합니다."
            exit 1
          fi
          if [ "$ACTION" = "push" ] && [ "$CONFIRM" != "apply" ]; then
            echo "::error::push 는 confirm 칸에 apply 를 입력해야 실행됩니다. 먼저 action: status 로 현황을 확인해 주세요."
            exit 1
          fi

      - name: Link project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"

      - name: Migration status
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase migration list

      - name: Push pending migrations
        if: inputs.action == 'push'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push
